# The app container runs on Dokploy's overlay network. e-Cidadania's WAF
# blocks nginx requests from that network, so /api/ecidadania/* is forwarded
# to the host-network sidecar in deploy/ecidadania-proxy.conf.
#
# Change 192.168.1.2 below if the host's LAN address changes.
map $http_cf_connecting_ip $ecidadania_client_ip {
  default $http_cf_connecting_ip;
  ""      $binary_remote_addr;
}
limit_req_zone $ecidadania_client_ip zone=ecidadania_client:10m rate=5r/s;
limit_conn_zone $ecidadania_client_ip zone=ecidadania_client_conn:10m;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed build assets never change, so they can be cached forever.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /api/ecidadania/ {
    limit_req zone=ecidadania_client burst=10 nodelay;
    limit_conn ecidadania_client_conn 8;
    limit_req_status 429;
    limit_conn_status 429;

    # Host-network sidecar; it owns the cache, upstream cap and portal headers.
    proxy_pass http://192.168.1.2:8084;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # The sidecar passes the portal's large CSP/header block through.
    proxy_buffer_size 64k;
    proxy_buffers 8 64k;
    proxy_busy_buffers_size 128k;
  }

  # The shell is revalidated so a new deploy is picked up on the next visit.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
