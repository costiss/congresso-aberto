# e-Cidadania does not send CORS headers. The app reads its JSON and detail
# pages through this same-origin reverse proxy.
#
# The cache is in /dev/shm (tmpfs), so it never touches disk. It is the first
# line of defence for the portal: each unique URL is fetched at most once per
# five minutes, and proxy_cache_lock collapses concurrent misses into one
# upstream call. max_conns caps how many connections this server can open to
# the portal at any time, so the server IP stays well below its rate limits.
proxy_cache_path /dev/shm/ecidadania levels=1:2 keys_zone=ecidadania:10m max_size=24m inactive=1h use_temp_path=off;

# Per-visitor limits: a page load makes two list requests and, on demand, a
# detail request. Cached responses are cheap, so the burst is generous.
# Behind Cloudflare the visitor is in CF-Connecting-IP; fall back to the socket
# address when the origin is reached directly.
map $http_cf_connecting_ip $ecidadania_client_ip {
  default $http_cf_connecting_ip;
  ""      $binary_remote_addr;
}
limit_req_zone $ecidadania_client_ip zone=ecidadania_client:10m rate=5r/s;
limit_conn_zone $ecidadania_client_ip zone=ecidadania_client_conn:10m;

upstream ecidadania_upstream {
  zone ecidadania_upstream 64k;
  server www12.senado.leg.br:443 max_conns=2;
  keepalive 8;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed build assets never change, so they can be cached forever.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /api/ecidadania/ {
    limit_req zone=ecidadania_client burst=10 nodelay;
    limit_conn ecidadania_client_conn 8;
    limit_req_status 429;
    limit_conn_status 429;

    proxy_pass https://ecidadania_upstream/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host www12.senado.leg.br;
    proxy_set_header User-Agent "congresso-aberto/1.0";
    proxy_ssl_server_name on;
    proxy_ssl_name www12.senado.leg.br;

    proxy_cache ecidadania;
    proxy_cache_key "$scheme$request_method$host$request_uri$http_accept";
    proxy_cache_valid 200 5m;
    proxy_cache_valid 404 1m;
    proxy_cache_lock on;
    proxy_cache_lock_age 5s;
    proxy_cache_lock_timeout 10s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;

    # Plone sets cookies and cache headers that would defeat the shared cache.
    proxy_ignore_headers Set-Cookie Cache-Control Expires;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;

    add_header Cache-Control "public, max-age=300" always;
    add_header X-Cache-Status $upstream_cache_status always;
  }

  # The shell is revalidated so a new deploy is picked up on the next visit.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
