# Host-network sidecar for e-Cidadania.
#
# The app container runs on Dokploy's overlay network. e-Cidadania's WAF
# blocks nginx requests from that network, even though the same request from
# the host works. This sidecar runs with `network_mode: host` and is the only
# process that talks to the portal.
#
# Run it on port 8084; the app's nginx proxies /api/ecidadania/* here.
proxy_cache_path /dev/shm/ecidadania levels=1:2 keys_zone=ecidadania:10m max_size=24m inactive=1h use_temp_path=off;

# The app's nginx is the only client, so a global limit is enough. The cache
# and the connection cap below are what actually protect the portal.
limit_req_zone $server_name zone=ecidadania_global:1m rate=10r/s;
limit_conn_zone $server_name zone=ecidadania_conn:1m;

server {
  listen 8084;
  server_name _;

  location /api/ecidadania/ {
    limit_req zone=ecidadania_global burst=20 nodelay;
    limit_conn ecidadania_conn 2;
    limit_req_status 429;
    limit_conn_status 429;

    # Direct proxy_pass, not an upstream block: the upstream block resolved to
    # an address the WAF rejected, while the direct form is allowed.
    proxy_pass https://www12.senado.leg.br/ecidadania/;
    proxy_http_version 1.1;
    proxy_set_header Connection "close";
    proxy_set_header Host www12.senado.leg.br;

    # The WAF allows this simple client shape. The app only consumes the body,
    # so the portal's browser-facing headers are irrelevant here.
    proxy_set_header User-Agent "Wget";
    proxy_set_header Accept "*/*";
    proxy_set_header Accept-Encoding "";
    proxy_set_header Cookie "";
    proxy_set_header Referer "";
    proxy_set_header Accept-Language "";
    proxy_set_header sec-ch-ua "";
    proxy_set_header sec-ch-ua-mobile "";
    proxy_set_header sec-ch-ua-platform "";
    proxy_set_header Priority "";
    proxy_set_header Sec-Fetch-Dest "";
    proxy_set_header Sec-Fetch-Mode "";
    proxy_set_header Sec-Fetch-Site "";
    proxy_set_header Upgrade-Insecure-Requests "";
    proxy_set_header TE "";
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header CF-IPCountry "";
    proxy_set_header CF-Ray "";
    proxy_set_header CF-Visitor "";
    proxy_set_header CDN-Loop "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Real-IP "";
    proxy_set_header True-Client-IP "";
    proxy_set_header Forwarded "";
    proxy_ssl_server_name on;
    proxy_ssl_name www12.senado.leg.br;

    # Plone can send a large header block; the nginx default is only 4k/8k.
    proxy_buffer_size 64k;
    proxy_buffers 8 64k;
    proxy_busy_buffers_size 128k;

    proxy_cache ecidadania;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_valid 200 5m;
    proxy_cache_valid 404 1m;
    proxy_cache_lock on;
    proxy_cache_lock_age 5s;
    proxy_cache_lock_timeout 10s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_ignore_headers Set-Cookie Cache-Control Expires;

    add_header X-Cache-Status $upstream_cache_status always;
  }
}
